name: chords
description: "Chords - Banco de acordes de guitarra con afinación en vivo"
publish_to: 'none'

version: 1.5.3+12

environment:
  sdk: ^3.13.4

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  dynamic_color: ^2.1.0
  firebase_analytics: ^12.6.0
  firebase_core: ^4.15.0
  firebase_crashlytics: ^5.4.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_soloud: ^5.1.6
  go_router: ^18.0.2
  logging: ^1.3.0
  material_color_utilities: ^0.13.0
  meta: ^1.16.0
  provider: ^6.1.5+1
  record: ^7.1.1
  shared_preferences: ^2.5.6
  slang: ^4.19.2
  slang_flutter: ^4.19.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/chords/chords_db.json

# CLI de desarrollo: `dart run bin/chords_cli.dart <comando>`
executables:
  chords_cli:
