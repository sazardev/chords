name: chords
description: "Chords - Banco de acordes de guitarra con afinación en vivo"
publish_to: 'none'

version: 1.1.0+2

environment:
  sdk: ^3.13.4

dependencies:
  args: ^2.7.0
  collection: ^1.19.1
  cupertino_icons: ^1.0.8
  flutter:
    sdk: flutter
  flutter_soloud: ^5.1.6
  go_router: ^18.0.2
  meta: ^1.16.0
  provider: ^6.1.5+1
  record: ^7.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  test: ^1.31.1

flutter:
  uses-material-design: true
  assets:
    - assets/chords/chords_db.json

# CLI de desarrollo: `dart run bin/chords_cli.dart <comando>`
executables:
  chords_cli:
